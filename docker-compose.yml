# Local debug only -- not used by the MSPbots deployment pipeline.
# Pass your own test tenant's Alloy Navigator credentials as headers when
# calling this service; the service itself never reads them from env vars.
services:
  alloy-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
